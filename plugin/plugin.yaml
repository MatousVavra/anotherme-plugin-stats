name: stats
version: 0.1.0
description: Conversation, notes, people, and facts counts
author: AnotherMe
entrypoint: plugin
capabilities:
  - routes
  - ui
  - events
dependencies:
  - memory
ui:
  tab: Stats
  icon: stats
  order: 60
settings:
  - key: refresh_interval
    label: "Refresh interval (seconds)"
    type: number
    default: 30
    min: 5
    max: 300
    step: 5
    description: "How often to refresh stats"
