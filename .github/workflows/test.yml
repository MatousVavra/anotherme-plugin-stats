name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install fastapi "pydantic>=2" httpx pyyaml pytest pytest-asyncio openai
      - name: Run unit tests
        run: pytest tests/ -v --ignore=tests/integration

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout plugin dependencies
        uses: actions/checkout@v4
        with:
          repository: MatousVavra/anotherme-plugin-memory
          ref: v0.1.0
          path: deps/memory
      # chat is not a manifest dependency, but the stats route queries its
      # chat_threads table (conversation count).
      - uses: actions/checkout@v4
        with:
          repository: MatousVavra/anotherme-plugin-chat
          ref: v0.1.0
          path: deps/chat
      - name: Run integration tests inside the released app image
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -v "$PWD/plugin:/data/plugins/stats" \
            -v "$PWD/deps/memory/plugin:/data/plugins/memory" \
            -v "$PWD/deps/chat/plugin:/data/plugins/chat" \
            -e PYTHONPATH=/app \
            ghcr.io/matousvavra/anotherme:latest \
            sh -c "cd /repo && pip install -q pytest pytest-asyncio && pytest tests/integration -v"
